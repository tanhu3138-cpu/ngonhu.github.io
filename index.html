<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiệp Mời Đãi Lính - Tạ Ngô Như</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:linear-gradient(135deg,#b71c1c,#ff9800);
    text-align:center;
    overflow-x:hidden;
    color:white;
}

.card{
    background:rgba(255,255,255,0.95);
    color:#333;
    margin:60px auto;
    padding:40px;
    border-radius:25px;
    max-width:520px;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    animation:fadeIn 1.5s ease-in-out;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    color:#d32f2f;
    font-size:28px;
}

button{
    padding:12px 25px;
    background:#d32f2f;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    margin-top:10px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#b71c1c;
    transform:scale(1.05);
}

input, select{
    padding:10px;
    width:90%;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

.success{
    display:none;
    margin-top:15px;
    background:#4caf50;
    color:white;
    padding:12px;
    border-radius:8px;
}

/* Hoa rơi */
.flower{
    position:fixed;
    top:-10px;
    font-size:20px;
    animation:fall linear infinite;
}

@keyframes fall{
    to{
        transform:translateY(100vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="card">
    <h1>🧧 THIỆP MỜI ĐÃI LÍNH 🧧</h1>
    <p><strong>Tạ Ngô Như</strong> trân trọng kính mời</p>
    <p>Đến tham dự buổi đãi lính đầu năm</p>

    <p><strong>⏰ 14h00 chiều - Mùng 6 Tết</strong></p>
    <p><strong>📅 Ngày 22 tháng 2</strong></p>

    <hr>

    <h2>XÁC NHẬN THAM DỰ</h2>

    <form id="rsvpForm" action="https://formsubmit.co/ngonhu08052005@gmail.com" method="POST">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">

        <input type="text" name="Họ tên" placeholder="Họ và tên" required>
        <input type="tel" name="Số điện thoại" placeholder="Số điện thoại" required>

        <select name="Tham dự" required>
            <option value="">Bạn có tham dự không?</option>
            <option value="Có tham dự">Có tham dự</option>
            <option value="Không tham dự">Không tham dự</option>
        </select>

        <button type="submit">GỬI XÁC NHẬN</button>
    </form>

    <div class="success" id="successMessage">
        🎉 Xác nhận thành công! Hẹn gặp mùng 5 nhé!
    </div>
</div>

<script>
document.getElementById("rsvpForm").addEventListener("submit", function(e){
    e.preventDefault();
    const form = this;

    fetch(form.action,{
        method:"POST",
        body:new FormData(form)
    }).then(()=>{
        document.getElementById("successMessage").style.display="block";
        form.reset();
        firework();
    });
});

/* Hoa mai rơi */
function createFlower(){
    const flower=document.createElement("div");
    flower.classList.add("flower");
    flower.innerHTML="🌸";
    flower.style.left=Math.random()*100+"vw";
    flower.style.animationDuration=(3+Math.random()*5)+"s";
    document.body.appendChild(flower);

    setTimeout(()=>{flower.remove();},8000);
}
setInterval(createFlower,500);

/* Pháo */
function firework(){
    alert("🎆 Chúc mừng năm mới! Hẹn gặp bạn!");
}
</script>

</body>
</html>
